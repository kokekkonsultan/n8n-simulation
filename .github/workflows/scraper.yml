name: Scraper Toko Google Maps

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Jenis toko dan lokasi, contoh: toko komputer di Bandung'
        required: true
        type: string
      max_results:
        description: 'Batas toko (1-60)'
        required: true
        default: '20'
        type: string

permissions:
  contents: read

jobs:
  scrape:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Siapkan Python x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: .github/requirements-scraper.txt

      - name: Install dependencies
        run: python -m pip install -r .github/requirements-scraper.txt

      - name: Uji scraper
        run: python -m unittest discover -s .github -p test_scraper.py -v

      - name: Install browser Chromium untuk Python
        run: python -m playwright install chromium

      - name: Cari toko dan email
        env:
          SCRAPER_QUERY: ${{ inputs.query }}
          SCRAPER_MAX_RESULTS: ${{ inputs.max_results }}
        run: |
          python .github/scraper.py --query $env:SCRAPER_QUERY --max-results $env:SCRAPER_MAX_RESULTS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload hasil CSV dan JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hasil-scraper-${{ github.run_id }}-${{ github.run_attempt }}
          path: scraper-output/
          if-no-files-found: warn
          retention-days: 7
